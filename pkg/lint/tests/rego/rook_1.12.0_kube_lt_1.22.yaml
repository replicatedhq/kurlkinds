installer:
  spec: 
    kubernetes: 
      version: 1.21.x
    containerd: 
      version: latest
    weave:
      version: latest
    rook: 
      version: 1.12.0
output:
  - message: Rook 1.12.x is only tested upstream with Kubernetes 1.22 through 1.28
    type: incompatibility
    severity: warning
  - message: Rook versions >= 1.12.0 requires Kubernetes versions 1.22+
    type: incompatibility
    severity: error
    patch:
      - op: replace
        path: /spec/kubernetes/version
        value: 1.26.1
