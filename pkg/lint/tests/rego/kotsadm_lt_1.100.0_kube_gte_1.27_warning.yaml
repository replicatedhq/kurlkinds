installer:
  spec:
    kubernetes:
      version: 1.27.0
      s3Override: "https://path.to.the/version.tar.gz"
    containerd:
      version: latest
    weave:
      version: latest
    kotsadm:
      version: 1.99.0
      s3Override: "https://path.to.the/version.tar.gz"
    minio:
      version: 2023-02-17T17-52-43Z
customPatch:
  - op: replace
    path: /spec/kotsadm/version
    value: 1.100.0
output:
  - message: KOTS versions < 1.100.0 do not support native Helm applications on Kubernetes 1.27+
    type: incompatibility
    severity: warning
