installer:
  spec:
    kubernetes:
      version: 1.36.0
      s3Override: "https://path.to.the/version.tar.gz"
    containerd:
      version: 1.7.29
      s3Override: "https://path.to.the/version.tar.gz"
    weave:
      version: latest
customPatch:
  - op: replace
    path: /spec/containerd/version
    value: 2.3.6
output:
  - message: Containerd versions < 2.0.0 are not compatible with Kubernetes 1.36+
    type: incompatibility
    severity: error
