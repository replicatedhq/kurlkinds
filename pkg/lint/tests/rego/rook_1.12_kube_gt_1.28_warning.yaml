installer:
  spec:
    kubernetes:
      version: 1.29.0
      s3Override: "https://path.to.the/version.tar.gz"
    containerd:
      version: latest
    weave:
      version: latest
    rook:
      version: 1.12.0
customPatch:
  - op: replace
    path: /spec/kubernetes/version
    value: 1.26.1
output:
  - message: Rook 1.12.x is only tested upstream with Kubernetes 1.22 through 1.28
    type: incompatibility
    severity: warning
