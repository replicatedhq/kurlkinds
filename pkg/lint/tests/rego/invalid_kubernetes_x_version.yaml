installer:
  spec:
    kubernetes:
      version: 99.99.x
    containerd:
      version: latest
    weave:
      version: latest
output:
  - message: Containerd versions < 2.0.0 are not compatible with Kubernetes 1.37+
    type: incompatibility
    severity: error
  - message: Unknown kubernetes add-on version 99.99.x
    type: unknown-addon
    severity: error
    patch:
      - op: replace
        path: /spec/kubernetes/version
        value: 1.26.1
