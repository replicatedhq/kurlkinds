installer:
  spec:
    kubernetes:
      version: 1.36.0
      s3Override: "https://path.to.the/version.tar.gz"
    containerd:
      version: 2.1.5
      s3Override: "https://path.to.the/version.tar.gz"
    weave:
      version: latest
customPatch:
  - op: replace
    path: /spec/containerd/version
    value: 2.2.0
output:
  - message: Containerd 2.1.x is not supported upstream with Kubernetes 1.36+
    type: incompatibility
    severity: warning
