installer:
  spec:
    kurl:
      installerVersion: v2023.01.03-0
    kubernetes:
      version: 1.22.x
    containerd:
      version: latest
    weave:
      version: latest
    rook:
      version: 1.4.3
      s3Override: "https://path.to.the/version.tar.gz"
customPatch:
  - op: replace
    path: /spec/rook/version
    value: 1.10.8
output:
  - message: Rook versions <= 1.4.9 are not compatible with Kubernetes versions 1.22+
    type: incompatibility
    severity: error
