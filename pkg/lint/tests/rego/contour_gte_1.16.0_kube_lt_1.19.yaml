installer:
  spec:
    kubernetes:
      version: 1.18.20
      s3Override: "https://path.to.the/version.tar.gz"
    containerd:
      version: latest
    weave:
      version: latest
    contour:
      version: 1.24.1
      s3Override: "https://path.to.the/version.tar.gz"
customPatch:
  - op: replace
    path: /spec/contour/version
    value: 1.15.2
output:
  - message: Contour versions >= 1.16.0 require Kubernetes 1.19+
    type: incompatibility
    severity: error
