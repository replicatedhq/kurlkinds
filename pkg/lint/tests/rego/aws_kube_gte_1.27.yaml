installer:
  spec:
    kubernetes:
      version: 1.27.0
      s3Override: "https://path.to.the/version.tar.gz"
    containerd:
      version: latest
    weave:
      version: latest
    aws:
      version: 0.1.0
customPatch:
  - op: remove
    path: /spec/aws
output:
