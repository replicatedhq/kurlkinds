installer:
  spec:
    kubernetes:
      version: 1.29.0
      s3Override: "https://path.to.the/version.tar.gz"
    containerd:
      version: latest
    weave:
      version: latest
    kotsadm:
      version: 1.105.1
      s3Override: "https://path.to.the/version.tar.gz"
    minio:
      version: 2023-02-17T17-52-43Z
customPatch:
  - op: replace
    path: /spec/kotsadm/version
    value: 1.105.2
output:
  - message: KOTS versions <= 1.105.1 are not compatible with Kubernetes 1.29+
    type: incompatibility
    severity: error
