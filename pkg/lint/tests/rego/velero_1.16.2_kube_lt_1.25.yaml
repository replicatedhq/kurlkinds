installer:
  spec:
    kubernetes:
      version: 1.24.17
      s3Override: "https://path.to.the/version.tar.gz"
    containerd:
      version: latest
    weave:
      version: latest
    velero:
      version: 1.16.2
      s3Override: "https://path.to.the/version.tar.gz"
customPatch:
  - op: replace
    path: /spec/velero/version
    value: 1.10.1
output:
  - message: Velero versions >= 1.16.2 require Kubernetes 1.25+
    type: incompatibility
    severity: error
