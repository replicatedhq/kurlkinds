installer:
  spec:
    kurl:
      installerVersion: v2026.10.30-0
    kubernetes:
      version: 1.24.17
    containerd:
      version: 1.7.29
    flannel:
      version: latest
    velero:
      version: 1.16.2
customPatch:
  - op: replace
    path: /spec/velero/version
    value: 1.15.2
output:
  - message: Velero versions >= 1.16.2 require Kubernetes 1.25+
    type: incompatibility
    severity: error
