installer:
  spec:
    kubernetes:
      version: 1.33.13
    containerd:
      version: latest
    flannel:
      version: latest
    openebs:
      version: 4.6.0
      isLocalPVEnabled: true
      localPVStorageClassName: local
    rook:
      version: 1.11.6
      s3Override: "https://path.to.the/version.tar.gz"
output:
  - message: Auto storage scaling requires at least OpenEBS 3.6.0 and Rook 1.11.7
    type: misconfiguration
    severity: error
    patch:
      - op: replace
        path: /spec/rook/version
        value: 1.19.7
      - op: replace
        path: /spec/openebs/version
        value: 4.6.0
